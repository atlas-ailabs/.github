<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--bg:#161817;--fg:#f4f1ea;--muted:#9a9a93;--soft:#c9c6bf;--line:rgba(244,241,234,.10);--chip:rgba(255,107,53,.12);--accent:#ff6b35}
body.light{--bg:#fbf9f4;--fg:#101211;--muted:#6b6b64;--soft:#34342f;--line:rgba(16,18,17,.10);--chip:rgba(255,107,53,.12)}
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:280px;overflow:hidden;background:transparent}
.card{position:absolute;inset:0;background:var(--bg);border:1px solid var(--line);border-radius:22px;overflow:hidden;
 display:grid;grid-template-columns:230px 1fr 400px;font-family:'Space Grotesk',sans-serif;color:var(--fg)}
.num{position:relative;border-right:1px solid var(--line);padding:38px 0 0 48px}
.num b{font-size:132px;font-weight:500;letter-spacing:-8px;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--accent)}
.num .bar{position:absolute;left:0;top:38px;width:4px;height:88px;background:var(--accent);border-radius:0 3px 3px 0}
.main{padding:38px 48px}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:2.5px;color:var(--accent);
 background:var(--chip);padding:7px 12px;border-radius:999px;margin-bottom:22px}
.tag svg{width:16px;height:16px}
h3{font-size:40px;font-weight:500;letter-spacing:-1.4px;line-height:1.05;margin-bottom:18px}
h3 span{color:var(--muted)}
p{font-size:19px;line-height:1.45;color:var(--soft);max-width:560px}
ul{list-style:none;border-left:1px solid var(--line);padding:0 40px;display:flex;flex-direction:column;justify-content:center;gap:22px}
li{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:500}
li i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
li i svg{width:16px;height:16px}
</style></head><body>
<div class="card">
 <div class="num"><div class="bar"></div><b id="n"></b></div>
 <div class="main"><div class="tag" id="tag"></div><h3 id="h"></h3><p id="d"></p></div>
 <ul id="f"></ul>
</div>
<script>
const S='fill="none" stroke="#ff6b35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"';
const ICON={
 chat:`<svg ${S}><path d="M8 9h8M8 13h6"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-5l-5 3v-3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h12z"/></svg>`,
 trend:`<svg ${S}><path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>`,
 plug:`<svg ${S}><path d="M7 12l5 5-1.5 1.5a3.5 3.5 0 0 1-5-5L7 12zM17 12l-5-5 1.5-1.5a3.5 3.5 0 0 1 5 5L17 12zM3 21l2.5-2.5M18.5 5.5 21 3M10 11l-2 2M13 14l-2 2"/></svg>`};
const CHECK=`<svg ${S} stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg>`;
const D=[
 {n:'01',icon:'chat',tag:'ATENDIMENTO CONECTADO',h:['Uma boa conversa.','Desde o primeiro contato.'],d:'Agentes que respondem dúvidas, entendem o contexto e ajudam seus clientes a encontrar o próximo passo.',f:['Atendimento no WhatsApp','Agendamentos na sua agenda','Encaminhamento para a equipe']},
 {n:'02',icon:'trend',tag:'VENDAS CONECTADAS',h:['Toda oportunidade','merece atenção.'],d:'Qualifique os contatos, organize as informações no CRM e ajude sua equipe a dar continuidade às conversas certas.',f:['Qualificação de leads','Integração com CRM','Acompanhamento de oportunidades']},
 {n:'03',icon:'plug',tag:'OPERAÇÃO CONECTADA',h:['Suas ferramentas.','Trabalhando juntas.'],d:'Conecte sistemas e automatize o caminho entre uma tarefa e outra. Menos copiar e colar. Mais tempo para decidir.',f:['Integração entre ferramentas','Organização de informações','Automação de processos internos']}];
const [theme,i]=location.hash.slice(1).split('-'); if(theme==='light')document.body.classList.add('light');
const c=D[+i];
n.textContent=c.n; tag.innerHTML=ICON[c.icon]+c.tag; h.innerHTML=`${c.h[0]}<br><span>${c.h[1]}</span>`; d.textContent=c.d;
f.innerHTML=c.f.map(x=>`<li><i>${CHECK}</i>${x}</li>`).join('');
</script></body></html>
