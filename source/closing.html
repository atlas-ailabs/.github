<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet"><link rel="stylesheet" href="base.css"><style>
html,body{height:390px}
.card{padding:52px 56px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;left:-200px;bottom:-360px;width:760px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.22),rgba(255,107,53,0) 62%)}
h2{position:relative;font-size:50px;font-weight:500;letter-spacing:-1.8px;line-height:1.05;margin:18px 0 18px;max-width:820px}
h2 span{color:var(--accent)}
p{position:relative;font-size:20px;color:var(--soft);line-height:1.45;max-width:760px}
.btn{position:relative;margin-top:30px;display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:#101211;font-weight:600;font-size:19px;padding:15px 24px;border-radius:999px}
.btn svg{width:20px;height:20px}
.mark{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:230px;height:230px}
.ring{position:absolute;right:30px;top:50%;transform:translateY(-50%);width:300px;height:300px;border:1px dashed var(--line);border-radius:50%}
</style></head><body><div class="card"><div class="glow"></div><div class="ring"></div>
<svg class="mark" viewBox="0 0 40 40"><g fill="#ff6b35"><path d="M5 32 17.5 7H25L12.5 32H5Z"/><path d="m23.5 17 12 15H25.5L19 24l4.5-7Z"/><path d="M16 29h9l2.4 3H14.5l1.5-3Z"/></g></svg>
<div class="eyebrow">VAMOS CONVERSAR</div>
<h2>Qual processo está tomando <span>tempo demais</span> da sua equipe?</h2>
<p>Conte para a Atlas. Vamos descobrir o que a IA pode fazer pelo seu negócio.</p>
<div class="btn">Conversar sobre meu projeto <svg viewBox="0 0 24 24" fill="none" stroke="#101211" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div><script>if(location.hash==="#light")document.body.classList.add("light")</script></body></html>
